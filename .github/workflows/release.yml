name: Release

# Publishes the operator image on Docker Hub and creates the v<appVersion> tag
# and GitHub release here, with the packaged install chart attached.
#
# The chart reaches users through memgraph/helm-charts, released there by that
# repository's own workflow: copy charts/memgraph-operator over, merge, and run
# its Release Charts workflow. Nothing here writes into another repository.
#
# Run it from the Actions tab. The version is the chart's appVersion on the
# branch it runs from, which is what a default install of the chart runs.
#
#   publish off  a dry run, from any branch: the image is built for both
#                architectures, the chart is packaged and installed on Kind
#                with it, and nothing is published.
#   publish on   a release, from main only: the same, plus pushing the image
#                and creating the tag and the GitHub release on the commit the
#                run built. A SemVer prerelease (0.2.0-rc.1) publishes for
#                real, but never moves :latest.
#
# See docs/releasing.md for the procedure and the credentials this needs.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (main only), instead of dry-running the pipeline.'
        type: boolean
        default: false

permissions: {}

# Releases are never cancelled halfway: a run stopped between pushing the image
# and creating the GitHub release leaves the version half-released.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: docker.io/memgraph/kubernetes-operator
  CHART_NAME: memgraph-operator
  CHART_NAMESPACE: memgraph-operator-system

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      chart_version: ${{ steps.resolve.outputs.chart_version }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # The release is named after the appVersion the chart declares, so a
      # default install of the packaged chart runs exactly this image. The tag
      # is created by this run, so it can only ever point at the commit that
      # was built; an existing tag elsewhere fails here, before anything is
      # built, and one on this very commit is a re-run finishing the job.
      - name: Resolve the versions
        id: resolve
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          chart_version=$(make -s chart-version)
          version=$(make -s chart-app-version)
          tag="v${version}"
          publish=${PUBLISH:-false}

          if [ "${publish}" = true ]; then
            if [ "${REF}" != refs/heads/main ]; then
              echo "::error::Releases are published from main only, not ${REF}. Untick publish for a dry run."
              exit 1
            fi
            # An annotated tag lists its commit on the peeled ^{} line, which
            # sorts after the tag object's own.
            existing=$(git ls-remote origin "refs/tags/${tag}" "refs/tags/${tag}^{}" | sort -k2 | awk 'END {print $1}')
            if [ -n "${existing}" ] && [ "${existing}" != "${SHA}" ]; then
              echo "::error::Tag ${tag} already exists on ${existing}, not ${SHA}. Bump the chart's appVersion on a pull request first."
              exit 1
            fi
          fi

          case "${version}" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          {
            echo "tag=${tag}"
            echo "chart_version=${chart_version}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
          } >>"${GITHUB_OUTPUT}"

          {
            echo "### Operator release ${version}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| operator version (appVersion) | \`${version}\` |"
            echo "| chart version | \`${chart_version}\` |"
            echo "| prerelease | \`${prerelease}\` |"
            echo "| publishing | \`${publish}\` |"
          } >>"${GITHUB_STEP_SUMMARY}"

      # Failing here beats failing after the image is already on Docker Hub.
      - name: Check the release credentials are present
        if: steps.resolve.outputs.publish == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${DOCKERHUB_USERNAME}" ] || missing+=(DOCKERHUB_USERNAME)
          [ -n "${DOCKERHUB_TOKEN}" ] || missing+=(DOCKERHUB_TOKEN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/releasing.md for what they are."
            exit 1
          fi

  image:
    name: Operator image
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Published tags are immutable, by convention and by the trust users place
      # in them -- including the 0.0.x and 1.0.0 tags in this repository, which
      # belong to the operator attempt archived on archive/pre-operator-mvp.
      #
      # An image built from this very commit is the exception: it is this same
      # release's earlier attempt, from a run that failed after the push. That
      # one is left alone and the build skipped, so re-running finishes the
      # release instead of being stopped by its own progress. The revision
      # label is what tells the two apart.
      - name: Check whether the image tag is already published
        id: existing
        if: needs.resolve.outputs.publish == 'true'
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}:${{ needs.resolve.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "published=false" >>"${GITHUB_OUTPUT}"
            echo "${IMAGE} is free."
            exit 0
          fi

          # Single-platform images inspect as a config object; multi-platform
          # ones as a map keyed by platform.
          revision=$(docker buildx imagetools inspect "${IMAGE}" --format '{{ json .Image }}' 2>/dev/null |
            jq -r 'if has("config") then . else (to_entries | .[0].value) end
                   | .config.Labels["org.opencontainers.image.revision"] // empty' 2>/dev/null || true)

          if [ "${revision}" = "${SHA}" ]; then
            echo "published=true" >>"${GITHUB_OUTPUT}"
            echo "::notice::${IMAGE} was already pushed from ${SHA}; skipping the build and carrying on."
            exit 0
          fi

          echo "::error::${IMAGE} already exists and was not built from ${SHA}. Bump the chart's appVersion."
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Docker Hub
        if: needs.resolve.outputs.publish == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest follows stable releases only, so a release candidate never
      # becomes what an unqualified pull resolves to.
      - name: Work out the image tags
        id: tags
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE_REPOSITORY}:${VERSION}"
            [ "${PRERELEASE}" = true ] || echo "${IMAGE_REPOSITORY}:latest"
            echo "EOF"
          } >>"${GITHUB_OUTPUT}"

      - name: Build and push the operator image
        if: needs.resolve.outputs.publish == 'true' && steps.existing.outputs.published != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=memgraph-operator
            org.opencontainers.image.description=Kubernetes operator for Memgraph high-availability clusters
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A dry run still builds both architectures, because a broken arm64 build
      # is exactly the kind of thing a rehearsal is for.
      - name: Build the operator image without pushing
        if: needs.resolve.outputs.publish != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ... and then exports the amd64 image alone, so the verify job can load
      # it into Kind and install the chart with its own default image tag. The
      # layers are already cached by the build above.
      - name: Export the image for the verify job
        if: needs.resolve.outputs.publish != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ needs.resolve.outputs.version }}
          outputs: type=docker,dest=/tmp/operator-image.tar
          cache-from: type=gha

      - name: Upload the image
        if: needs.resolve.outputs.publish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-image
          path: /tmp/operator-image.tar
          retention-days: 1

  chart:
    name: Package chart
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # The chart ships CRDs and RBAC rules generated from the Go sources. At a
      # release this is not a style check: it is what makes the chart's CRD the
      # one this operator's types describe.
      - name: Verify the generated chart manifests
        run: make chart-verify

      - name: Lint the chart
        run: make helm-lint

      - name: Package the chart
        run: make chart-package

      - name: Upload the packaged chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-package
          path: dist/chart/*.tgz
          retention-days: 7

  verify:
    name: Verify the install
    needs: [resolve, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.32.0

      - name: Create a Kind cluster
        run: kind create cluster --name release-verify

      # A published release pulls the image just pushed from Docker Hub. A dry
      # run never pushed it, so it is loaded into Kind under the exact tag the
      # chart's appVersion resolves to.
      - name: Download the locally built image
        if: needs.resolve.outputs.publish != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operator-image
          path: /tmp

      - name: Load the image into Kind
        if: needs.resolve.outputs.publish != 'true'
        run: |
          set -euo pipefail
          docker load --input /tmp/operator-image.tar
          kind load docker-image "${IMAGE_REPOSITORY}:${{ needs.resolve.outputs.version }}" \
            --name release-verify

      - name: Download the packaged chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-package
          path: dist/chart

      # The chart is installed with its own defaults, image reference included.
      - name: Install the operator
        env:
          VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          set -euo pipefail
          helm install "${CHART_NAME}" "dist/chart/${CHART_NAME}-${VERSION}.tgz" \
            --namespace "${CHART_NAMESPACE}" --create-namespace \
            --wait --timeout 5m

      # What the release actually promises: installing chart <version> runs the
      # operator its appVersion names. A template bug would satisfy every string
      # comparison made so far and still fail here.
      - name: Check the running operator is the released image
        env:
          EXPECTED: ${{ env.IMAGE_REPOSITORY }}:${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          actual=$(kubectl get deployment "${CHART_NAME}-controller-manager" \
            --namespace "${CHART_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="manager")].image}')
          if [ "${actual}" != "${EXPECTED}" ]; then
            echo "::error::The chart installed ${actual}, expected ${EXPECTED}."
            exit 1
          fi
          kubectl get crd memgraphclusters.memgraph.com >/dev/null
          echo "Installed ${actual}, with the MemgraphCluster CRD."

      - name: Uninstall
        if: always()
        run: |
          helm uninstall "${CHART_NAME}" --namespace "${CHART_NAMESPACE}" --ignore-not-found
          kind delete cluster --name release-verify

  github-release:
    name: GitHub release
    needs: [resolve, verify]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Creating the tag and the release.
      contents: write
    steps:
      - name: Download the packaged chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-package
          path: dist/chart

      # --target makes GitHub create the tag on the commit this run built.
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists; nothing to do."
            exit 0
          fi

          notes=$(cat <<EOF
          Operator image \`${IMAGE_REPOSITORY}:${VERSION}\`, installed by chart \`${CHART_VERSION}\` (attached).
          EOF
          )

          prerelease=()
          [ "${PRERELEASE}" = true ] && prerelease=(--prerelease)

          gh release create "${TAG}" dist/chart/*.tgz \
            --repo "${REPO}" \
            --target "${SHA}" \
            --title "${TAG}" \
            --notes "${notes}" \
            --generate-notes \
            "${prerelease[@]}"
