                        items:
                          type: string
                        type: array
                      command:
                        description: command overrides the image's entrypoint.
                        items:
                          type: string
                        type: array
                      env:
                        description: |-
                          env passes literal, non-secret environment variables to the sidecar —
                          bucket names, prefixes, regions. Credentials belong in envFromSecrets.
                        items:
                          description: |-
                            EnvVar is one non-secret environment variable set on a role's Memgraph
                            container. Only literal values are supported — there is deliberately no
                            valueFrom — so secret material stays confined to the secrets block and the CR
                            remains safe to commit.
                          properties:
                            name:
                              description: name is the environment variable's name.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                              type: string
                            value:
                              description: value is the literal, non-secret value.
                              maxLength: 4096
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      envFromSecrets:
                        description: |-
