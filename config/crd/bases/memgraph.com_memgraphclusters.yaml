                      rule: self.all(e, !(e.name in ['MEMGRAPH_ENTERPRISE_LICENSE',
                        'MEMGRAPH_ORGANIZATION_NAME', 'POD_NAME']))
                  data:
                    description: data are added to every data instance pod's Memgraph
                      container.
                    items:
                      description: |-
                        EnvVar is one non-secret environment variable set on a role's Memgraph
                        container. Only literal values are supported — there is deliberately no
                        valueFrom — so secret material stays confined to the secrets block and the CR
                        remains safe to commit.
                      properties:
                        name:
                          description: name is the environment variable's name.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        value:
                          description: value is the literal, non-secret value.
                          maxLength: 4096
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                    x-kubernetes-validations:
                    - message: extraEnv must not set MEMGRAPH_ENTERPRISE_LICENSE or
                        MEMGRAPH_ORGANIZATION_NAME (they come from the secrets block)
