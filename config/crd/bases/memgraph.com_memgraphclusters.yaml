---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: memgraphclusters.memgraph.com
spec:
  group: memgraph.com
  names:
    kind: MemgraphCluster
    listKind: MemgraphClusterList
    plural: memgraphclusters
    shortNames:
    - mgc
    singular: memgraphcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.coordinators
      name: Coordinators
      type: integer
    - jsonPath: .spec.dataInstances
      name: Data
      type: integer
    - jsonPath: .status.main
      name: Main
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Converged")].status
      name: Converged
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MemgraphCluster is the Schema for the memgraphclusters API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of MemgraphCluster
            properties:
              coordinators:
                default: 3
                description: |-
                  coordinators is the number of Raft coordinator instances. It must be odd
                  so the Raft quorum cannot split, and it is immutable: scaling is not
                  supported in v1alpha1.
                format: int32
                maximum: 7
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: coordinators must be an odd number (1, 3, 5 or 7) so the
                    Raft quorum cannot split
                  rule: self % 2 == 1
                - message: 'coordinators is immutable: changing the coordinator count
                    of an existing MemgraphCluster is not supported in v1alpha1'
                  rule: self == oldSelf
              dataInstances:
                default: 2
                description: |-
                  dataInstances is the number of data instances. It is immutable: scaling
                  is not supported in v1alpha1.
                format: int32
                maximum: 15
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: 'dataInstances is immutable: changing the data instance
                    count of an existing MemgraphCluster is not supported in v1alpha1'
                  rule: self == oldSelf
              image:
                default: {}
                description: image selects the Memgraph container image run by all
                  cluster pods.
                properties:
                  pullPolicy:
                    default: IfNotPresent
                    description: pullPolicy is the image pull policy applied to all
                      cluster pods.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  repository:
                    default: docker.io/memgraph/memgraph
                    description: |-
                      repository is the Memgraph container image repository. It carries the
                      optional registry host and the image path only; the version belongs in
                      tag.
                    maxLength: 255
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: repository must not contain a digest; pin the image
                        with tag instead
                      rule: '!self.contains(''@'')'
                    - message: repository must not contain a tag; set image.tag instead
                      rule: '!self.substring(self.lastIndexOf(''/'') + 1).contains('':'')'
                  tag:
                    default: 3.12.0-relwithdebinfo
                    description: |-
                      tag is the Memgraph container image tag. Prefer pinning a specific
                      Memgraph version over mutable tags such as "latest".
                    maxLength: 128
                    minLength: 1
                    pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]*$
                    type: string
                type: object
              secrets:
                default: {}
                description: |-
                  secrets references the Secret holding the enterprise license and
                  organization name.
                properties:
                  licenseKey:
                    default: MEMGRAPH_ENTERPRISE_LICENSE
                    description: licenseKey is the key within the Secret holding the
                      enterprise license.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  name:
                    default: memgraph-secrets
                    description: name is the name of the Secret in the cluster's namespace.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  organizationKey:
                    default: MEMGRAPH_ORGANIZATION_NAME
                    description: |-
                      organizationKey is the key within the Secret holding the organization
                      name the license was issued to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: licenseKey and organizationKey must name different keys
                    of the Secret
                  rule: '!has(self.licenseKey) || !has(self.organizationKey) || self.licenseKey
                    != self.organizationKey'
            type: object
          status:
            description: status defines the observed state of MemgraphCluster
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the MemgraphCluster resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              main:
                description: |-
                  main is the name of the data instance currently observed as MAIN, as
                  reported by SHOW INSTANCES on the coordinator leader. It is empty before
                  the initial MAIN is elected and updates when the Raft coordinators fail
                  over to a different instance.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
